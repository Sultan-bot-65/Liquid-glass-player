name: Build APK from zip

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        working-directory: ${{ github.workspace }}
        run: |
          unzip -q liquid_glass_player.zip -d _extract
          mkdir app
          cp -r _extract/*/. app/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: flutter create --platforms=android --org com.liquidglass --project-name liquid_glass_player --no-pub .

      - name: Patch manifest, MainActivity and icons
        run: python3 tool/patch_android.py

      - name: Install signing key
        run: |
          mkdir -p ~/.android
          cp tool/signing/debug.keystore ~/.android/debug.keystore

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm,android-arm64

      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk LiquidGlassPlayer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassPlayer-apk
          path: app/LiquidGlassPlayer.apk
          if-no-files-found: error
